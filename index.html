<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TablerIcons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.47.0/tabler-icons-200.min.css" integrity="sha512-zDwDnyfLle2c87N9D6zssQzAkp9P7I+SlMdHlWMgVlK0yCcEslrgl8TzbEBvHdv9fsSD0NjfI6jZ6DzN2Ik8ng==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./style/style.css">

    <!-- local css for testing -->
    <link rel="stylesheet" href="./style/local.css">

    <title>ShelfTracker</title>
</head>

<body>
    <div class="banner">
        <div class="profileInfo">
            <img src="https://static.thenounproject.com/png/1743560-200.png" alt="user icon" class="profileAvatar">
            <h1>Nanashi's Shelf</h1>
        </div>
    </div>

    <div class="controls">
        <select id="filterSelect">
            <option value="all">Any State</option>
            <option value="planToPlay">Plan to Play</option>
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="paused">Paused</option>
            <option value="abandoned">Abandoned</option>
        </select>
        
        <div class="sortSelect">
            <label for="sortSelect">Order:</label>
            <select id="sortSelect">
                <option value="custom">Custom</option>
                <option value="rating">Rating</option>
                <option value="playTime">Playtime</option>
                <option value="name">Name</option>
            </select>
            <button id="sortDirection"><i class="ti ti-arrow-narrow-up"></i></button>
        </div>
        
        <fieldset id="viewSelect">
            <legend class="sr-only">view</legend>
            
            <input type="radio" name="view" id="view-grid" value="grid" class="sr-only-input">
            <label for="view-grid" aria-label="grid view">
                <i class="ti ti-layout-grid"></i>
            </label>
            
            <input type="radio" name="view" id="view-list" value="list" class="sr-only-input">
            <label for="view-list" aria-label="list view">
                <i class="ti ti-layout-list"></i>
            </label>
        </fieldset>
    </div>

    <div id="app" class="appContainer">
        
    </div>

    <dialog id="gameFormModal">
        <form id="gameForm">
            <input type="text" name="name" placeholder="Game Name" required>
            <input type="url" name="thumbnail" placeholder="Img URL">
            <input type="number" name="release" placeholder="Launch Year">
            <input type="number" name="rating" min="0" max="10" placeholder="Rating">
            <input type="number" name="playTime" placeholder="Played Hours">
            <select name="playState">
                <option value="planToPlay">Plan to Play</option>
                <option value="playing">Playing</option>
                <option value="completed">Completed</option>
                <option value="paused">Paused</option>
                <option value="abandoned">Abandoned</option>
            </select>
            <textarea name="review" placeholder="Review"></textarea>
            <button type="submit">Add Game</button>
        </form>
    </dialog>

    <div id="listBtns">
        <button id="addGameBtn">Add Game</button>
        <button id="editBtn">Edit Game</button>
        <button id="deleteBtn">Delete Game</button>
    </div>
    
    <script src="./js/main.js"></script>
</body>
</html>
