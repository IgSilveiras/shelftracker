<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TablerIcons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.47.0/tabler-icons-200.min.css" integrity="sha512-zDwDnyfLle2c87N9D6zssQzAkp9P7I+SlMdHlWMgVlK0yCcEslrgl8TzbEBvHdv9fsSD0NjfI6jZ6DzN2Ik8ng==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./style/style.css">

    <!-- local css for testing -->
    <link rel="stylesheet" href="./style/local.css">

    <title>ShelfTracker</title>
</head>

<body>
    <div class="banner">
        <div class="profileInfo">
            <img src="https://static.thenounproject.com/png/1743560-200.png" alt="user icon" class="profileAvatar">
            <h1>Nanashi's Shelf</h1>
        </div>
    </div>

    <div class="controls">
        <select id="filterSelect">
            <option value="all">Any State</option>
            <option value="planToPlay">Plan to Play</option>
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="paused">Paused</option>
            <option value="abandoned">Abandoned</option>
        </select>
        
        <div class="sortSelect">
            <label for="sortSelect">Order:</label>
            <select id="sortSelect">
                <option value="custom">Custom</option>
                <option value="rating">Rating</option>
                <option value="playTime">Playtime</option>
                <option value="name">Name</option>
            </select>
            <button id="sortDirection"><i class="ti ti-arrow-narrow-up"></i></button>
        </div>
        
        <fieldset id="viewSelect">
            <legend class="sr-only">view</legend>
            
            <input type="radio" name="view" id="view-grid" value="grid" class="sr-only-input">
            <label for="view-grid" aria-label="grid view">
                <i class="ti ti-layout-grid"></i>
            </label>
            
            <input type="radio" name="view" id="view-list" value="list" class="sr-only-input">
            <label for="view-list" aria-label="list view">
                <i class="ti ti-layout-list"></i>
            </label>
        </fieldset>
    </div>

    <div id="app" class="appContainer">
        
    </div>

    <dialog id="gameFormModal" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Add Game</h2>

        <form id="gameForm">
            <div class="formGroup" id="formNameGroup">
                <label for="formName">Game Name</label>
                <input type="text" name="name" id="formName" placeholder="Game Name" required>
            </div>

            <div class="formGroup" id="formPlayTimeGroup">
                <label for="formPlayTime">Playtime</label>
                <input type="number" name="playTime" id="formPlayTime" placeholder="Played Hours">
            </div>

            <div class="formGroup" id="formRatingGroup">
                <label for="formRating">Rating</label>
                <input type="number" name="rating" id="formRating" min="0" max="10" placeholder="Rating">
            </div>

            <div class="formGroup" id="formPlayStateGroup">
                <label for="formPlayState">Play State</label>
                <select name="playState" id="formPlayState">
                    <option value="planToPlay">Plan to Play</option>
                    <option value="playing">Playing</option>
                    <option value="completed">Completed</option>
                    <option value="paused">Paused</option>
                    <option value="abandoned">Abandoned</option>
                </select>
            </div>

            <div class="formGroup" id="formIntensityGroup">
                <label for="formIntensity" id="formIntensityLabel">Intensity</label>
                <select name="intensity" id="formIntensity">
                    <option value="">None</option>
                    <option value="casual">Casual</option>
                    <option value="tryhard">Tryhard</option>
                </select>

                <div id="formCompleted100Group" hidden>
                    <input type="checkbox" name="completed100" id="formCompleted100">
                    <label for="formCompleted100">100%</label>
                </div>
            </div>

            <div class="formGroup" id="formThumbnailGroup">
                <label for="formThumbnail">Thumbnail URL</label>
                <input type="url" name="thumbnail" id="formThumbnail" placeholder="Img URL">
            </div>

            <div class="formGroup" id="formReleaseGroup">
                <label for="formRelease">Release Year</label>
                <input type="number" name="release" id="formRelease" placeholder="Launch Year">
            </div>

            <div class="formGroup" id="formReviewGroup">
                <label for="formReview">Review</label>
                <textarea name="review" placeholder="Review" id="formReview"></textarea>
            </div>

            <button type="submit">Add Game</button>
        </form>
    </dialog>

    <div id="listBtns">
        <button id="addGameBtn">Add Game</button>
        <button id="editBtn">Edit Game</button>
        <button id="deleteBtn">Delete Game</button>
    </div>

    <footer>
        <p>© 2026 NanashiDev</p>
    </footer>
    
    <script src="./js/main.js"></script>
</body>
</html>
